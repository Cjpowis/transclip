[package]
name = "transclip"
version = "0.1.0"
edition = "2024"
description = "YouTube transcripts straight to your clipboard: human captions, then YouTube's automatic transcript, then NVIDIA Parakeet on your Mac"
license = "MIT"
repository = "https://github.com/Cjpowis/transclip"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
indicatif = "0.18.6"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
textwrap = "0.16.4"
parakeet-rs = "0.3"
hound = "3.5"
# parakeet-rs 0.3 is written against ort rc.13; rc.15 changed the API.
ort = { version = "=2.0.0-rc.13", default-features = false }
ctrlc = { version = "3.5.2", features = ["termination"] }
sha2 = "0.11.1"

[profile.release]
lto = "thin"
